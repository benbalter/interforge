# GitLab's generated description declares list endpoints as returning a single
# entity. The API returns a JSON array. Replace each list response schema with
# an array of that entity. (Overlay `update` merges, so remove the old schema first.)
overlay: 1.0.0
info:
  title: GitLab list responses are arrays
  version: 1.0.0
actions:
  - target: $.paths['/api/v4/users'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/api/v4/users'].get.responses['200'].content['application/json']
    update:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/APIEntitiesUserBasic'
  - target: $.paths['/api/v4/projects/{id}/issues'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/api/v4/projects/{id}/issues'].get.responses['200'].content['application/json']
    update:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/APIEntitiesIssue'
  - target: $.paths['/api/v4/projects/{id}/issues/{noteable_id}/notes'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/api/v4/projects/{id}/issues/{noteable_id}/notes'].get.responses['200'].content['application/json']
    update:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/APIEntitiesNote'
  - target: $.paths['/api/v4/projects/{id}/merge_requests'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/api/v4/projects/{id}/merge_requests'].get.responses['200'].content['application/json']
    update:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/APIEntitiesMergeRequestBasic'
  - target: $.paths['/api/v4/projects/{id}/merge_requests/{noteable_id}/notes'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/api/v4/projects/{id}/merge_requests/{noteable_id}/notes'].get.responses['200'].content['application/json']
    update:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/APIEntitiesNote'
  - target: $.paths['/api/v4/projects/{id}/repository/commits/{sha}/statuses'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/api/v4/projects/{id}/repository/commits/{sha}/statuses'].get.responses['200'].content['application/json']
    update:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/APIEntitiesCommitStatus'
  - target: $.paths['/api/v4/projects/{id}/repository/tree'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/api/v4/projects/{id}/repository/tree'].get.responses['200'].content['application/json']
    update:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/APIEntitiesTreeObject'
