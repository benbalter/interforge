# GET /projects/{id}/repository/files/{file_path} is documented with no
# response schema. Describe the body the API returns (checked against
# gitlab.com).
overlay: 1.0.0
info:
  title: GitLab repository file response
  version: 1.0.0
actions:
  - target: $.paths['/api/v4/projects/{id}/repository/files/{file_path}'].get.responses['200']
    update:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InterforgeRepositoryFile'
  - target: $.components.schemas
    update:
      InterforgeRepositoryFile:
        type: object
        required:
          [
            file_name,
            file_path,
            size,
            encoding,
            content,
            ref,
            blob_id,
            commit_id,
          ]
        properties:
          file_name: { type: string }
          file_path: { type: string }
          size: { type: integer }
          encoding: { type: string, example: base64 }
          content: { type: string }
          content_sha256: { type: string }
          ref: { type: string }
          blob_id: { type: string }
          commit_id: { type: string }
          last_commit_id: { type: string }
          execute_filemode: { type: boolean }
